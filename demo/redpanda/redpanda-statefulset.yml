apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  labels:
    app: redpanda
spec:
  serviceName: redpanda-service
  selector:
    matchLabels:
      app: redpanda
  volumeClaimTemplates:
  - metadata:
      name: redpanda-volume
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
      - name: redpanda
        image: redpandadata/redpanda:v26.2.6
        ports:
        - name: kafka
          containerPort: 9092
        args:
        - redpanda
        - start
        - --mode=dev-container
        - --advertise-kafka-addr=redpanda-service:9092
        - --kafka-addr=0.0.0.0:9092
        - --smp=1 # limiting CPU
        - --memory=1G # limiting RAM
        volumeMounts:
        - mountPath: /var/lib/redpanda/data # default for redpanda
          name: redpanda-volume
        resources:
          limits:
          # limiting container resources
          # there is also requests,
          # it equals limits when omitted
            cpu: 1
            memory: 1.5Gi
