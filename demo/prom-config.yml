apiVersion: v1
kind: ConfigMap
metadata:
  name: prom-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
    remote_write:
    - url: http://receive-service:19291/api/v1/receive
    - url: http://tq-service:8080/api/v1/write
